<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="icon" href="data:,">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Upload model</title>
<style>
  :root { --bg:#fff; --fg:#111; --mut:#666; --acc:#0b62d6; --ok:#1a7f37; --bad:#c62828; }
  @media (prefers-color-scheme: dark) { :root { --bg:#111; --fg:#eee; --mut:#999; } }
  * { box-sizing:border-box; }
  body { font-family:system-ui,-apple-system,sans-serif; background:var(--bg); color:var(--fg);
         margin:0 auto; padding:16px; max-width:560px; }
  label { display:block; font-size:14px; color:var(--mut); margin-top:10px; }
  input, textarea { font-size:16px; width:100%; padding:8px; border-radius:8px; border:1px solid #888;
                    background:var(--bg); color:var(--fg); }
  button { margin-top:14px; font-size:18px; padding:12px 20px; border:0; border-radius:10px;
           background:var(--acc); color:#fff; }
  #out { margin-top:14px; white-space:pre-wrap; } .ok { color:var(--ok); } .bad { color:var(--bad); }
  .mut { color:var(--mut); font-size:13px; }
</style>
</head>
<body>
<h1>Upload a model</h1>
<p class="mut">ONNX, input <code>(N, 100, 6)</code> float32 in <code>load()</code> units, output
<code>(N, 6)</code> scores in the order left, right, up, down, circle, idle. After the upload, open
<a href="live">/live</a> on your phone and pick your model.</p>
<form id="f">
  <label>Class token</label><input name="token" id="token" required autocomplete="off">
  <label>Pair name (same for every upload)</label><input name="team" id="team" required>
  <label>Model name</label><input name="name" placeholder="cnn v2">
  <label>Notes: your validation split and accuracy, number of training takes</label>
  <input name="notes" placeholder="by-person val 0.91, n=1800">
  <label>model.onnx</label><input type="file" name="file" accept=".onnx" required>
  <button>Upload</button>
</form>
<div id="out"></div>
<script>
const $ = id => document.getElementById(id);
const store = { get: k => { try { return localStorage.getItem(k) || ""; } catch (e) { return ""; } },
                set: (k, v) => { try { localStorage.setItem(k, v); } catch (e) {} } };
const q = new URLSearchParams(location.search).get("t");
if (q) store.set("token", q);
$("token").value = store.get("token");
$("team").value = store.get("team");
$("f").addEventListener("submit", async ev => {
  ev.preventDefault();
  store.set("token", $("token").value.trim()); store.set("team", $("team").value.trim());
  $("out").className = ""; $("out").textContent = "Uploading and scoring…";
  try {
    const r = await fetch("api/models", { method: "POST", body: new FormData($("f")) });
    const j = await r.json().catch(() => ({}));
    if (!r.ok) throw new Error(j.detail || r.status);
    const s = j.score || {};
    if (s.error) { $("out").className = "bad"; $("out").textContent = "Uploaded, but it could not be scored:\n" + s.error; return; }
    $("out").className = "ok";
    if (s.check) { $("out").textContent = `Uploaded. The model runs (${s.ms.toFixed(2)} ms per take). Now open /live on your phone and pick it.`; return; }
    $("out").textContent = `Accuracy on hidden people: ${s.acc.toFixed(3)} (${s.n} takes, ${s.ms.toFixed(2)} ms per take)\n` +
      Object.entries(s.per_class).map(([g, a]) => `  ${g}: ${a === null ? "-" : a.toFixed(2)}`).join("\n");
  } catch (e) { $("out").className = "bad"; $("out").textContent = "Upload failed: " + e.message; }
});
</script>
</body>
</html>
